name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install quality tools
        run: python -m pip install --upgrade pip ruff pytest
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest -m "not gpu"
