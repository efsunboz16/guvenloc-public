name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install quality tools and CPU dependencies
        # GPU paketleri (torch, romav2) CI'da kurulmaz; o testler @pytest.mark.gpu ile atlanır.
        run: >-
          python -m pip install --upgrade pip ruff pytest
          numpy==2.5.4 scipy==1.18.1 pandas==3.1.1 rasterio==1.5.2 pyyaml
          opencv-python-headless==5.1.0.95 matplotlib==3.11.2
      - name: Ruff
        run: ruff check .
      - name: Tests
        shell: bash
        run: |
          if find tests -type f -name 'test_*.py' -print -quit 2>/dev/null | grep -q .; then
            pytest -m "not gpu"
          else
            echo "No tests yet; skipping pytest."
          fi
