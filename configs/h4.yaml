# H4 ön-kaydı (karar F5-1, 26.11.2026) — M4 filtre sonuçları (calib/test) görülmeden ÖNCE sabitlendi.
# Ölçüt MIMARI.md "Hedef 5 / H4" ile aynı; yalnız işlemselleştirildi. Değiştirmek yeni karar ister.
# Test bölgeleri (02, 03, 06) Faz 6'da, tek sefer.
version: h4_v1
rows:
  single: "6"          # tek kare: pipeline Decision.xy (M1-C 4a dönmesi, hacim tepesi), kabulden BAĞIMSIZ her karede
  filter: "7"          # parçacık filtresi: ağırlıklı ortalama konum
frames: all_positive   # her uçuşun bütün pozitif kareleri, dosya sırasıyla; filtre ilk KABUL edilen karede başlar,
                       # öncesindeki karelerde satır 7 = satır 6 (sayısı raporlanır)
error: gps_m           # yatay uzaklık, GT = bölge CSV'si (K1); GT gürültü tabanı F5-2'de ölçüldü
criteria:              # TEST bölgelerinde (02, 03, 06), havuzlanmış, Faz 6
  median_reduction_min: 0.20     # (med6 − med7) / med6 ≥ 0,20
  wilcoxon_p_max: 0.05           # eşleştirilmiş, tek yönlü (hata7 < hata6), kare başına
  coverage_min: 0.88             # satır 7: hata ≤ yarıçap oranı, filtre başladıktan sonraki bütün karelerde
radius:
  spread: weighted_q90           # parçacıkların ağırlıklı ortalamaya uzaklığının ağırlıklı %90 yüzdeliği
  kappa_from: calibration        # yarıçap = κ · yayılım; κ calib (05+11) karelerinde %90 kapsama verecek en küçük değer
calibration_regions: ["05", "11"]
tuning_regions: ["01", "04", "08", "09", "10"]   # filtre hiper-parametreleri YALNIZ burada (calib'e dokunmadan)
secondary:             # raporlanır, H4 kararı değil
  - başarı@25 ve @50 (McNemar)
  - bölge başına medyan hata
  - satır 7-noupd (M3 reddinde güncelleme yine de yapılır) — M3 kapısının katkısı
  - satır 7-cv (B planı: sabit hız modeli, drone↔drone eşleşmesi yok)
  - 5C: γ eşikli uydu eşleştirmesi (atlanan oran ve hata)
bootstrap: {block_frames: 50, B: 2000}
dry_runs:              # karar değil: eğitimde ayarlanmış filtre → calib
  - {tune: ["01", "04", "08", "09", "10"], eval: ["05", "11"]}
